<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Picker</title>
    <link rel="stylesheet" href="./src/styles/datepicker.css">
</head>
<body>
    <div class="datepicker">
        <input class="datepick" type="date" name="datepick" id="datepick">
        <div class="calendar">
            <div class="datepicker__month-select">
            <button><</button>
            <p>December 2022</p>
            <button>></button>
        </div>
        <div class="dates">
            <div class="dates__row dates__row--initials">
                <p>S</p>
                <p>M</p>
                <p>T</p>
                <p>W</p>
                <p>T</p>
                <p>F</p>
                <p>S</p>
            </div>
            <div class="dates__row">
                <p></p>
                <p></p>
                <p></p>
                <p></p>
                <p>1</p>
                <p>2</p>
                <p>3</p>
            </div>
            <div class="dates__row">
                <p>4</p>
                <p>5</p>
                <p>6</p>
                <p>7</p>
                <p>8</p>
                <p>9</p>
                <p>10</p>
                
            </div>
            <div class="dates__row">
                <p>11</p>
                <p>12</p>
                <p>13</p>
                <p>14</p>
                <p>15</p>
                <p>16</p>
                <p>17</p>
            </div>
            
            <div class="dates__row">
                <p>18</p>
                <p>19</p>
                <p>20</p>
                <p>21</p>
                <p>22</p>
                <p>23</p>
                <p>24</p>
            </div>
            <div class="dates__row">
                <p>25</p>
                <p>26</p>
                <p>27</p>
                <p>28</p>
                <p>29</p>
                <p>30</p>
                <p>31</p>    
            </div>
                
        </div>
        </div>
        
    </div>
</body>
</html>
